# Cloud Run JOB running the ingestion worker (one-shot; parallelism = tasks).
#
#   gcloud run jobs replace deploy/ingestion/cloudrun/job.yaml --region REGION
#   gcloud run jobs execute stealth-ingest-worker --region REGION --tasks 8   # 8 independent workers
#
# Rendered by `stealth-ops deploy-workers` (fills the @-tokens, the image and the shard entries; the rendered copy is never committed).
# Secrets come from Secret Manager (never from this file). Tasks are independent workers:
# a task that times out or is preempted simply stops; its leases expire and other tasks
# (or the next execution) retry the jobs. Duplicate delivery is safe (idempotent handlers).
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: stealth-ingest-worker
spec:
  template:
    spec:
      parallelism: 4              # tasks running at once (each = one worker process)
      taskCount: 4
      template:
        spec:
          maxRetries: 1           # infra-level retry only; job-level retry/backoff is the queue's
          timeoutSeconds: 3600    # must exceed INGEST_JOB_TIMEOUT_SECONDS; leases cover the rest
          containers:
            - image: REGION-docker.pkg.dev/PROJECT/stealth/ingest-worker:latest
              args: ["--once", "--max-jobs", "500"]
              resources:
                limits: { cpu: "2", memory: 2Gi }
              env:
                - { name: STEALTHLAB_ENV, value: PRODUCTION }
                # 4 tasks x 4 lanes = 16 concurrent ingestion lanes.
                - { name: INGEST_WORKER_CONCURRENCY, value: "4" }   # lanes per task; DB pool = 2*lanes+4
                # Public GitHub API: 60 req/hr unauthenticated, 5000 req/hr with a token.
                - { name: GITHUB_TOKEN, valueFrom: { secretKeyRef: { name: stealth-github-token, key: latest } } }
                - { name: INGEST_LEASE_SECONDS, value: "300" }
                # Multi-procedure documents take 800-1200s+; stays under timeoutSeconds (3600).
                - { name: INGEST_JOB_TIMEOUT_SECONDS, value: "3000" }
                - { name: INGEST_IDLE_EXIT_SECONDS, value: "20" }
                # Vertex AI via the job's own service account (ADC, no API key): judge + embeddings.
                - { name: VERTEX_PROJECT, value: "kell-509215" }
                - { name: VERTEX_REGION, value: "us-central1" }
                # Set ONLY here, not config.py's default: local dev without ADC keeps gemini,voyage.
                # embeddings.py has no runtime fallback across providers by design (no mixed spaces).
                - { name: EMBEDDING_PROVIDER_CHAIN, value: "vertex" }
                - { name: RELEASE, value: "@RELEASE@" }                      # git sha; stamped by `stealth-ops deploy-workers`
                - { name: OBSERVABILITY_ENABLED, value: "@OBSERVABILITY_ENABLED@" }
                - { name: OBSERVABILITY_BACKEND, value: "@OBSERVABILITY_BACKEND@" }
                - { name: OTEL_SERVICE_NAME, value: "stealthlab" }
                - { name: DAILY_LLM_BUDGET_USD, value: "@DAILY_LLM_BUDGET_USD@" }   # same cap the API enforces; workers stop leasing at 100%
                - { name: SERVICE_TOKEN_ISSUER, value: "@SERVICE_TOKEN_ISSUER@" }
                - { name: SERVICE_TOKEN_AUDIENCE, value: "@SERVICE_TOKEN_AUDIENCE@" }
                - { name: SERVICE_TOKEN_MAX_TTL_SECONDS, value: "@SERVICE_TOKEN_MAX_TTL_SECONDS@" }
                - { name: OBJECT_STORAGE_URL, value: "@OBJECT_STORAGE_URL@" }
                - { name: OBJECT_STORAGE_ENDPOINT_URL, value: "@OBJECT_STORAGE_ENDPOINT_URL@" }
                - { name: AWS_DEFAULT_REGION, value: auto }
                - { name: CONTROL_DATABASE_URL, valueFrom: { secretKeyRef: { name: stealth-control-db-url, key: latest } } }
                - { name: GEMINI_API_KEY,       valueFrom: { secretKeyRef: { name: stealth-gemini-key,    key: latest } } }
                - { name: GEMINI_API_KEYS,      valueFrom: { secretKeyRef: { name: stealth-gemini-keys,   key: latest } } }
                # Document/skill extraction uses the Gemini OpenAI-compatible endpoint through the
                # general-compute client; the worker refuses to start without key + model. The key
                # pool rotates on per-key quota exhaustion (_general_compute_client).
                - { name: GENERAL_COMPUTE_API_KEY, valueFrom: { secretKeyRef: { name: stealth-gemini-key, key: latest } } }
                - { name: GENERAL_COMPUTE_API_KEYS, valueFrom: { secretKeyRef: { name: stealth-gemini-keys, key: latest } } }
                - { name: GENERAL_COMPUTE_BASE_URL, value: "https://generativelanguage.googleapis.com/v1beta/openai/" }
                - { name: GENERAL_COMPUTE_JUDGE_MODEL, value: "gemini-3.8-flash" }
                - { name: GENERAL_COMPUTE_FALLBACK_MODEL, value: "gemma-4-31b-it" }
                - { name: SEMANTIC_GEMINI_MODEL, value: "gemini-3.8-flash" }
                - { name: VOYAGE_API_KEY,      valueFrom: { secretKeyRef: { name: stealth-voyage-key,    key: latest } } }
                - { name: JEV_BASE_URL,         valueFrom: { secretKeyRef: { name: stealth-jev-url,       key: latest } } }
                - { name: JEV_API_KEY,          valueFrom: { secretKeyRef: { name: stealth-jev-key,       key: latest } } }
                - { name: AWS_ACCESS_KEY_ID,     valueFrom: { secretKeyRef: { name: stealth-object-storage-key-id, key: latest } } }
                - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: stealth-object-storage-secret, key: latest } } }
                - { name: INGEST_SERVICE_TOKEN,  valueFrom: { secretKeyRef: { name: stealth-ingest-service-token, key: latest } } }
                - { name: SERVICE_TOKEN_KEYS,    valueFrom: { secretKeyRef: { name: stealth-service-token-keys, key: latest } } }
                - { name: SENTRY_DSN,            valueFrom: { secretKeyRef: { name: stealth-sentry-dsn, key: latest } } }
                - { name: OTEL_EXPORTER_OTLP_ENDPOINT, valueFrom: { secretKeyRef: { name: stealth-otlp-endpoint, key: latest } } }
                - { name: OTEL_EXPORTER_OTLP_HEADERS,  valueFrom: { secretKeyRef: { name: stealth-otlp-headers, key: latest } } }
                # one env var per registered knowledge shard, generated by `stealth-ops deploy-workers` (the registry stores only the NAME):
                # @SHARD_ENV@
---
# Cloud Scheduler drives a steady drain without keeping anything running:
#   gcloud scheduler jobs create http stealth-ingest-tick --schedule="*/10 * * * *" \
#     --uri="https://REGION-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/PROJECT/jobs/stealth-ingest-worker:run" \
#     --http-method=POST --oauth-service-account-email=SCHEDULER_SA
# Service mode (long-running poller) is also supported: run the same image with args ["--loop"]
# and min-instances=1, concurrency=1 (the worker is not an HTTP server; use a Job unless you need --loop).
