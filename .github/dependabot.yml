# Dependency update PRs. Security updates are raised regardless of this schedule; the weekly run keeps the rest current.
# Fix times for what these find are in docs/security/vulnerability_policy.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /prod_frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      prod-frontend-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /packaging/npm
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
