name: CI

# Minimal offline CI: runs the two test suites that are proven to need no
# database, no API key, and no network I/O (see each job's comment). Does
# NOT run backend/tests/** - that suite has a long-standing, board-logged
# dependency on a live Postgres instance (many tests fail rather than skip
# without DATABASE_URL/backend/.env in a fresh checkout); wiring a
# disposable-Postgres service container for it is a separate, larger piece
# of work tracked on the project board, not part of this minimal setup.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-tests:
    name: Harness suite (experiments/harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pure-stdlib harness code + pytest; httpx is imported (lazily) by
      # openrouter_arms.py's default transport constructor, exercised by
      # two offline tests that never perform an actual request - no other
      # third-party dependency exists anywhere under experiments/harness.
      - run: pip install pytest httpx

      - run: pytest experiments/harness -q

  packaging-tests:
    name: Packaging suite (packaging/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # packaging/ imports backend/ modules by path (see _bootstrap.py -
      # no install of backend itself needed, just its dependencies on
      # sys.path) for status_server.py's read-only FastAPI app; every
      # offline test doubles the database (FakePool), so nothing here
      # ever opens a real connection.
      - run: pip install -r backend/requirements.txt
      - run: pip install -e "packaging[test]"

      - run: pytest packaging/tests -q

  mcp-client:
    # packaging/npm: the zero-dependency `stealthlab-mcp` connector (npx /
    # curl | bash / irm | iex). Pure Node, offline -- its relay test runs
    # against an in-process HTTP server. All three OSes, because it writes
    # agent configs at OS-specific paths and spawns .cmd shims on Windows.
    name: MCP client (packaging/npm, ${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "22"]
    defaults:
      run:
        working-directory: packaging/npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/stealthlab-mcp.mjs --help
      - if: runner.os != 'Windows'
        run: bash -n install/install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  goal-hierarchy-e2e:
    # The Goal abstraction DAG, placement and Benchmark transfer against a real
    # Postgres + pgvector, migrated from zero. The offline suites use fake pools,
    # which is how several SQL-level defects in this area reached main unseen.
    name: Goal hierarchy e2e (live Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stealthlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stealthlab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python scripts/migrate.py
        working-directory: backend
      - run: pytest tests/test_goal_abstraction_e2e.py -q
        working-directory: backend
      # Tenant isolation: one user's private rows never reach another user or an
      # anonymous caller -- through the MCP v1 surface and the REST routers.
      # (test_search_privacy_leak_e2e needs a real embedding key, which CI does not have.)
      # Storage layout v2: a knowledge shard and a search member as extra databases on the same server, then the
      # production-layout write path and the MCP find_ways tool on top of it.
      - name: Shard layout e2e (write path + MCP find_ways)
        env:
          STEALTHLAB_MCP_TOKEN: ci-token
          TEST_SHARD_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sl_k001
          SEARCH_GROUP_TEST_DSN: postgresql://postgres:postgres@localhost:5432/sl_s901
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE sl_k001" -c "CREATE DATABASE sl_s901"
          python scripts/migrate.py --dsn "$TEST_SHARD_DATABASE_URL"
          python scripts/migrate.py --dsn "$SEARCH_GROUP_TEST_DSN"
          pytest tests/test_verified_write_sharded_e2e.py -q
        working-directory: backend
      - name: Tenant isolation e2e
        run: pytest tests/test_mcp_tenant_isolation_e2e.py tests/test_cross_user_isolation_e2e.py -q
        working-directory: backend

  mcp-server-image:
    # The hosted MCP server image (backend/Dockerfile.mcp-server) must build;
    # it is what railway.mcp.json deploys.
    name: MCP server image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f backend/Dockerfile.mcp-server -t stealthlab-mcp-server:ci .
