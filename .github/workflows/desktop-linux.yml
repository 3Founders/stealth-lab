name: Desktop Linux build

# kell desktop for Linux: built and checked inside Ubuntu 20.04 (glibc 2.31), so what it ships runs on 20.04 and newer. The AppImage,
# the .deb and latest-linux.yml are kept as the run's artifact; scripts/linux-smoke.sh checks the build (native modules, engine,
# documents, the app and its features, AppImage, .deb install, the one-line installer). Started by hand.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the Linux files to this kell-desktop release (e.g. v0.1.29); empty = build and check only"
        required: false
        default: ""
  push:
    branches: [desktop-linux]

jobs:
  linux:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: System packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git python3 make g++ g++-10 gcc-10 xz-utils binutils file \
            libgtk-3-0 libnss3 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0 libnotify4 libgbm1 libasound2 libdrm2 libxkbcommon0 \
            libuuid1 xdg-utils xvfb xauth fakeroot dpkg-dev procps
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build node-pty for Electron on 20.04
        working-directory: desktop
        # Electron 45's headers need C++20: 20.04's own g++-10 (its stock g++ 9 has no -std=gnu++20); same glibc and libstdc++ as 20.04
        env:
          CC: gcc-10
          CXX: g++-10
        run: npx --yes @electron/rebuild@3.7.2 -f -w node-pty
      - name: Build AppImage and .deb
        working-directory: desktop
        run: npm run dist:linux
      - name: Check everything a Linux user touches
        working-directory: desktop
        run: bash scripts/linux-smoke.sh
      # Publishing from here, not from a laptop: the release files are hundreds of MB, and some networks cannot download them back
      # from GitHub's file storage (2026-11-18). Needs the KELL_RELEASES_TOKEN secret (contents: write on AnujB05/kell-desktop only).
      - name: Attach to the kell-desktop release
        if: ${{ success() && github.event.inputs.release_tag != '' }}
        working-directory: desktop/release
        env:
          GH_TOKEN: ${{ secrets.KELL_RELEASES_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "KELL_RELEASES_TOKEN is not set: nothing published"; exit 1; }
          apt-get install -y -qq --no-install-recommends gh >/dev/null 2>&1 || {
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
            apt-get update -qq && apt-get install -y -qq gh >/dev/null; }
          gh release upload "$TAG" kell-*-x86_64.AppImage kell-*-amd64.deb latest-linux.yml --repo AnujB05/kell-desktop --clobber
          gh release view "$TAG" --repo AnujB05/kell-desktop --json assets --jq '[.assets[].name]|join(", ")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kell-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/latest-linux.yml
          if-no-files-found: warn
