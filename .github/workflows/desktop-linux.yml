name: Desktop Linux build

# kell desktop for Linux: built and checked inside Ubuntu 20.04 (glibc 2.31), so what it ships runs on 20.04 and newer. The AppImage,
# the .deb and latest-linux.yml are kept as the run's artifact; scripts/linux-smoke.sh checks the build (native modules, engine,
# documents, the app and its features, AppImage, .deb install, the one-line installer). Started by hand.
on:
  workflow_dispatch:
  push:
    branches: [desktop-linux]

jobs:
  linux:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: System packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git python3 make g++ xz-utils binutils file \
            libgtk-3-0 libnss3 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0 libnotify4 libgbm1 libasound2 libdrm2 libxkbcommon0 \
            libuuid1 xdg-utils xvfb xauth fakeroot dpkg-dev procps
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build node-pty for Electron on 20.04
        working-directory: desktop
        run: npx --yes @electron/rebuild@3.7.2 -f -w node-pty
      - name: Build AppImage and .deb
        working-directory: desktop
        run: npm run dist:linux
      - name: Check everything a Linux user touches
        working-directory: desktop
        run: bash scripts/linux-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kell-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/latest-linux.yml
          if-no-files-found: warn
