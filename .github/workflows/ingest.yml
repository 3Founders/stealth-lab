name: Stealth Wave 1 Ingestion

on:
  workflow_dispatch:
    inputs:
      enqueue:
        description: "Run Wave 1 discovery/enqueue first?"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
  VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

  # Built-in GitHub token for authenticated GitHub API access
  GITHUB_TOKEN: ${{ github.token }}

jobs:

  enqueue:
    name: Discover and enqueue Wave 1
    if: ${{ inputs.enqueue }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pin exact final commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA="fb568c8bbab65913d7842161d96c62ce7e2e92b0"

          git fetch --all --tags
          git checkout "$EXPECTED_SHA"

          echo "Checked out:"
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify Wave 1 manifest
        shell: bash
        run: |
          set -euo pipefail

          test -f config/skill_sources.yaml
          echo "Found config/skill_sources.yaml"
          ls -lh config/skill_sources.yaml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Verify required configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "ERROR: DATABASE_URL is missing"
            exit 1
          fi

          echo "DATABASE_URL is present"

          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "ERROR: GITHUB_TOKEN is missing"
            exit 1
          fi

          echo "GITHUB_TOKEN is present"

      - name: Discover and enqueue packages
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          python scripts/ingest_skills.py ingest \
            --queue-only


  workers:
    name: Worker ${{ matrix.worker }}
    needs: enqueue
    if: ${{ always() && (needs.enqueue.result == 'success' || needs.enqueue.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4]

    env:
      CALLER_TAG: gha-wave1-${{ github.run_id }}-${{ matrix.worker }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pin exact final commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA="bb3dbb1e14a326a70d8b3a98b1f0fa6347599ec8"

          git fetch --all --tags
          git checkout "$EXPECTED_SHA"

          echo "Worker ${{ matrix.worker }} checked out:"
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Verify required configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "ERROR: DATABASE_URL is missing"
            exit 1
          fi

          echo "DATABASE_URL is present"

      - name: Consume queued jobs until queue is empty
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import asyncio
          import json
          import os

          from app.db.session import create_pool
          from app.services.ingestion_jobs import process_pending_jobs


          async def main():
              worker_id = os.environ.get("CALLER_TAG", "unknown-worker")

              print(f"STARTING WORKER: {worker_id}", flush=True)

              pool = await create_pool(os.environ["DATABASE_URL"])

              totals = {
                  "claimed": 0,
                  "done": 0,
                  "failed": 0,
                  "unknown_type": 0,
              }

              iteration = 0

              try:
                  while True:
                      iteration += 1

                      result = await process_pending_jobs(
                          pool,
                          limit=1,
                      )

                      for key in totals:
                          totals[key] += int(result.get(key, 0))

                      print(
                          json.dumps(
                              {
                                  "worker": worker_id,
                                  "iteration_number": iteration,
                                  "iteration": result,
                                  "totals": totals,
                              }
                          ),
                          flush=True,
                      )

                      if int(result.get("claimed", 0)) == 0:
                          break

              finally:
                  await pool.close()

              print(f"WORKER COMPLETE: {worker_id}", flush=True)
              print(json.dumps(totals, indent=2), flush=True)

              if totals["failed"] or totals["unknown_type"]:
                  raise SystemExit(1)


          asyncio.run(main())
          PY


  summary:
    name: Wave 1 summary
    needs:
      - enqueue
      - workers
    if: always()

    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pin exact final commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA="bb3dbb1e14a326a70d8b3a98b1f0fa6347599ec8"

          git fetch --all --tags
          git checkout "$EXPECTED_SHA"

          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Print ingestion job status
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import asyncio
          import os

          from app.db.session import create_pool


          async def main():
              pool = await create_pool(os.environ["DATABASE_URL"])

              try:
                  rows = await pool.fetch(
                      """
                      SELECT
                          status,
                          COUNT(*) AS count
                      FROM ingestion_jobs
                      WHERE job_type = 'ingest_skill_package'
                      GROUP BY status
                      ORDER BY status
                      """
                  )

                  print()
                  print("======================================")
                  print("WAVE 1 SKILL INGESTION JOBS")
                  print("======================================")

                  total = 0

                  for row in rows:
                      count = int(row["count"])
                      total += count
                      print(f"{row['status']}: {count}")

                  print("--------------------------------------")
                  print(f"TOTAL: {total}")
                  print("======================================")

              finally:
                  await pool.close()


          asyncio.run(main())
          PY

      - name: Check workflow outcome
        shell: bash
        run: |
          echo "Enqueue result: ${{ needs.enqueue.result }}"
          echo "Workers result: ${{ needs.workers.result }}"

          if [ "${{ needs.enqueue.result }}" != "success" ]; then
            echo "ERROR: enqueue phase did not succeed"
            exit 1
          fi

          if [ "${{ needs.workers.result }}" != "success" ]; then
            echo "ERROR: one or more ingestion workers failed"
            exit 1
          fi

          echo "Wave 1 GitHub Actions execution completed successfully."