name: site and room checks

# One small gate: what passes today and protects chat. The older full-repo workflows were removed because they failed on every push
# (they needed files that are not in the repository). The unrelated backend failures are not run here.
on:
  push:
    branches: [main]
    paths: ["routing_kell_frontend/**", "backend/app/services/rooms.py", "backend/app/services/room_*.py", "backend/app/mcp_server/room_*.py", "backend/tests/test_room*", ".github/workflows/site.yml"]
  pull_request:
    paths: ["routing_kell_frontend/**", "backend/app/services/rooms.py", "backend/app/services/room_*.py", "backend/app/mcp_server/room_*.py", "backend/tests/test_room*", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: routing_kell_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: routing_kell_frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx next build

  rooms-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      # DATABASE_URL is deliberately unset: these are the offline room and agent tests.
      - run: python -m pytest tests/test_room_agent_route_offline.py tests/test_room_agent_markup_offline.py tests/test_room_files_offline.py tests/test_room_split_offline.py -q
