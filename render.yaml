# NOTE (Phase 34 / "MCP TASK STATE"): the MCP server
# (app/mcp_server/server.py) has no service entry below -- it is not
# deployed here today. README_MCP_SERVER.md's own posture is explicit:
# "treat this as a way to reach the server from another process/machine
# you already trust, not as a public deployment." That is a real,
# current fact about this file, not an oversight: adding a `web` service
# for it here would assert a deployment that does not exist.
#
# If/when the MCP server does get a service entry here, its startCommand
# MUST pin `--workers 1` explicitly (uvicorn app.mcp_server.server:app
# --workers 1 -- see server.py's own comment on why this is load-bearing:
# TasksExtension's task store is in-memory and single-process). That
# pin is now also enforced in code, not just documentation: constructing
# TasksExtension() checks settings.mcp_worker_count
# (app/mcp_server/tasks_extension.py::assert_single_worker) and refuses to
# boot if it is set above 1 -- so a render.yaml that forgot the pin would
# still be caught by the app itself as long as MCP_WORKER_COUNT is set to
# match the real `--workers` value at deploy time (that match is a
# deployment-config responsibility this in-process guard cannot verify by
# itself -- see assert_single_worker's own docstring).
databases:
  - name: stealthlab-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: stealthlab-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stealthlab-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://frontend-tau-one-80.vercel.app
      - key: GOVERNANCE_ENABLED
        value: "true"
      - key: DAILY_LLM_BUDGET_USD
        value: "10.0"
      - key: PER_VIEWER_DAILY_BUDGET_USD
        value: "1.0"
      - key: PRIVATE_VISIBILITY_ENABLED
        value: "false"
      - key: REAL_AUTH_ENABLED
        value: "false"
      - key: USE_LOCAL_MODELS
        value: "false"
      - key: USE_GENERAL_COMPUTE
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
