[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stealthlab-connect"
version = "0.1.0"
description = "Installable entry points that connect an external agent to StealthLab: MCP server launcher, Claude Code trace-collector hook CLI, and the read-only status page server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "mcp[cli]>=2.0.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "fastapi>=0.100",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
stealthlab-mcp-server = "stealthlab_connect.server_entry:main"
stealthlab-trace-hook = "stealthlab_connect.collector_entry:main"
stealthlab-status-page = "stealthlab_connect.status_entry:main"
stealthlab-public-board = "stealthlab_connect.scoreboard_gen:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stealthlab_connect = ["status_page.html"]
