<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StealthLab status</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171c23; --panel2: #1e252e; --line: #2a3341;
    --text: #d7dee8; --dim: #8a97a8; --accent: #4da3ff;
    --ok: #35c07f; --warn: #e0a63a; --bad: #e06456; --neutral: #5b6675;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 12px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 20px 60px; }
  section { margin-top: 26px; }
  section > h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--accent); margin: 0 0 10px; border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }
  section > h2 .count { color: var(--dim); text-transform: none; letter-spacing: 0; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    margin-bottom: 8px;
  }
  .card > summary {
    cursor: pointer; list-style: none; padding: 9px 12px;
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary:hover { background: var(--panel2); }
  .card[open] > summary { border-bottom: 1px solid var(--line); }
  .title { font-weight: bold; }
  .dim { color: var(--dim); }
  .pill {
    font-size: 11px; padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .pill.in   { color: var(--ok);   border-color: var(--ok); }
  .pill.out  { color: var(--bad);  border-color: var(--bad); }
  .pill.verified { color: var(--ok);     border-color: var(--ok); }
  .pill.candidate{ color: var(--warn);   border-color: var(--warn); }
  .pill.retired  { color: var(--bad);    border-color: var(--bad); }
  .pill.quarantined, .pill.disabled, .pill.stale { color: var(--warn); border-color: var(--warn); }
  .cap {
    font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line);
    white-space: nowrap;
  }
  .cap.l0 { color: var(--neutral); } .cap.l1 { color: var(--dim); }
  .cap.l2 { color: var(--accent); border-color: var(--accent); }
  .cap.l3 { color: var(--ok); border-color: var(--ok); }
  .cap.l4 { color: var(--ok); border-color: var(--ok); background: rgba(53,192,127,.08); }
  .cap.l5 { color: #7ef0b6; border-color: #7ef0b6; background: rgba(126,240,182,.10); }
  .route.auto_route { color: var(--ok); } .route.offer_as_candidate { color: var(--warn); }
  .route.refuse_reuse { color: var(--bad); }
  .body { padding: 10px 14px 14px; }
  .kv { display: grid; grid-template-columns: 170px 1fr; gap: 2px 12px; margin: 6px 0; }
  .kv dt { color: var(--dim); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .trail { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12.5px; }
  .trail th { text-align: left; color: var(--dim); font-weight: normal; padding: 3px 8px;
              border-bottom: 1px solid var(--line); }
  .trail td { padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .err { color: var(--bad); padding: 10px 0; }
  .notice {
    color: var(--warn); border: 1px solid var(--warn); border-radius: 4px;
    padding: 6px 12px; margin-top: 14px; font-size: 12.5px;
  }
  .loading { color: var(--dim); padding: 10px 0; }
  code.short { color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>StealthLab status</h1>
  <span class="sub" id="posture">read-only surface &middot; episodes &rarr; claims &rarr; procedures</span>
  <span class="spacer"></span>
  <span class="sub" id="viewer"></span>
  <button id="refresh">refresh</button>
</header>
<main>
  <div id="error" class="err" hidden></div>
  <div id="notice" class="notice" hidden></div>

  <section id="sec-episodes">
    <h2>Episodes <span class="count" id="count-episodes"></span></h2>
    <div id="episodes"><div class="loading">loading&hellip;</div></div>
  </section>

  <section id="sec-claims">
    <h2>Claims <span class="count" id="count-claims"></span></h2>
    <div id="claims"><div class="loading">loading&hellip;</div></div>
  </section>

  <section id="sec-procedures">
    <h2>Procedures <span class="count" id="count-procedures"></span></h2>
    <div id="procedures"><div class="loading">loading&hellip;</div></div>
  </section>
</main>

<script>
"use strict";

const state = { meta: null, overview: null, trails: {} };

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function short(id) { return String(id).slice(0, 8); }

function graphLink(id) {
  const base = (state.meta && state.meta.api_base) || "";
  return `${base}/v1/graph/${id}`;
}

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} -> HTTP ${res.status}`);
  return res.json();
}

// ---------- renderers ----------

function kv(rows) {
  const parts = rows.filter(([, v]) => v != null && v !== "")
    .map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`);
  return parts.length ? `<dl class="kv">${parts.join("")}</dl>` : "";
}

function linkTag(target) {
  const label = target.name ? esc(target.name) : `<code class="short">${esc(short(target.target_id))}</code>`;
  return `<a href="${graphLink(target.target_id)}" target="_blank" rel="noopener">${label}</a>`;
}

function renderEpisode(ep) {
  const when = ep.start_ts || ep.timestamp || "";
  const links = (ep.links || []).map(linkTag).join(", ");
  const md = ep.metadata || {};
  const body = kv([
    ["type", esc(ep.episode_type)],
    ["session", esc(ep.session_id)],
    ["project", esc(ep.project_id)],
    ["window", `${esc(ep.start_ts)} &rarr; ${esc(ep.end_ts)}`],
    ["events", md.n_events != null ? esc(md.n_events) : null],
    ["segmenter", md.segmenter ? esc(md.segmenter) : null],
    ["flags", (md.flags && md.flags.length) ? esc(md.flags.join(", ")) : null],
    ["linked nodes", links],
    ["episode id", `<code class="short">${esc(ep.id)}</code>`],
  ]);
  return `<details class="card">
    <summary><span class="title">${esc(ep.episode_type)}</span>
      <span class="dim">${esc(when)}</span>
      ${ep.session_id ? `<span class="pill">session ${esc(short(ep.session_id))}</span>` : ""}
      ${(md.flags || []).includes("oversize_unsubdivided") ? '<span class="pill out">oversize</span>' : ""}
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function claimSources(claim) {
  if (!(claim.sources || []).length) return "<span class='dim'>no recorded observation sources (pre-claim_sources promotion)</span>";
  const rows = claim.sources.map(s =>
    `<tr><td>${esc(s.observation_type)}</td><td>${esc(s.label)}</td>` +
    `<td>${esc(s.extractor_kind)}/${esc(s.extractor_name)}@${esc(s.code_version)}${s.model_id ? ` (${esc(s.model_id)})` : ""}</td></tr>`);
  return `<table class="trail"><tr><th>observation</th><th>label</th><th>extractor</th></tr>${rows.join("")}</table>`;
}

function renderClaim(c) {
  const triple = [c.subject, c.predicate, c.object].filter(Boolean).join(" / ");
  const statement = c.statement || c.name || "";
  const body = kv([
    ["statement", esc(statement)],
    ["triple", esc(triple)],
    ["epistemic status", esc(c.epistemic_status)],
    ["extraction", c.extraction_version ? esc(c.extraction_version) : null],
    ["valid from", esc(c.t_valid)],
    ["claim id", `<code class="short">${esc(c.id)}</code>`],
  ]) + `
  <details><summary class="dim">provenance chain (${(c.sources || []).length})</summary><div class="body">${claimSources(c)}</div></details>
  <div class="body" data-trail-for="${esc(c.id)}"></div>`;
  return `<details class="card" data-trail-type="claim" data-trail-id="${esc(c.id)}">
    <summary><span class="title">${esc(statement.slice(0, 90))}${statement.length > 90 ? "&hellip;" : ""}</span>
      <span class="pill ${c.truth_state === "OUT" ? "out" : "in"}">${esc(c.truth_state || "?")}</span>
      ${c.evidence_count ? `<span class="pill">${c.evidence_count} evidence</span>` : ""}
      ${c.epistemic_status ? `<span class="pill">${esc(c.epistemic_status)}</span>` : ""}
    </summary>
    <div class="body">${body}</div>
  </details>`;
}

function capabilityBadge(cap) {
  if (!cap) return "";
  return `<span class="cap l${cap.level}" title="P lower bound ${cap.p_lower?.toFixed(3)}, Wilson 95%">` +
    `L${cap.level} ${esc(cap.level_label)} &middot; P&#770;=${cap.p_estimate.toFixed(3)}</span>`;
}

function renderProcedure(p) {
  const cap = p.capability || {};
  const gates = cap.gates_reported || {};
  const envs = (cap.environments_held || []).join(", ");
  const body = kv([
    ["goal", esc(p.goal)],
    ["version", `${esc(p.version)} (procedure_id <code class="short">${esc(short(p.procedure_id))}</code>)`],
    ["lifecycle", `${esc(p.verification_state)} / ${esc(p.staleness)} / ${esc(p.availability)}`],
    ["outcomes", `${cap.success_count}/${cap.evidence_count} successes, ${cap.independent_groups} independent groups`],
    ["environments held", esc(envs)],
    ["routing (from P)", `<span class="route ${esc(cap.routing)}">${esc(cap.routing)}</span>`],
    ["Wilson interval", `[${cap.p_lower?.toFixed(3)}, ${cap.p_upper?.toFixed(3)}]`],
    ["unclaimed gates", Object.entries(gates).filter(([, v]) => !v).map(([k]) => esc(k)).join(", ") || null],
    ["created", esc(p.created_at)],
    ["row id", `<code class="short">${esc(p.id)}</code>`],
  ]);
  return `<details class="card" data-trail-type="procedure" data-trail-id="${esc(p.id)}">
    <summary><span class="title">${esc(p.name)}</span>
      ${capabilityBadge(cap)}
      <span class="pill ${esc(p.availability)}">${esc(p.availability)}</span>
      <span class="pill ${esc(p.verification_state)}">${esc(p.verification_state)}</span>
      ${p.staleness !== "fresh" ? `<span class="pill stale">${esc(p.staleness)}</span>` : ""}
    </summary>
    <div class="body">${body}<div data-trail-for="${esc(p.id)}"></div></div>
  </details>`;
}

function trailTable(evidence) {
  if (!evidence.length) return "<span class='dim'>no live evidence rows for this target</span>";
  const rows = evidence.map(e => `<tr>
    <td>${esc(e.evidence_type)}</td>
    <td class="route ${esc(e.direction)}">${esc(e.direction)}</td>
    <td>${e.outcome_status ? `<span class="pill ${e.outcome_status === "success" ? "in" : "out"}">${esc(e.outcome_status)}</span>` : '<span class="dim">&ndash;</span>'}</td>
    <td>${e.strength_score != null ? Number(e.strength_score).toFixed(2) : ""} <span class="dim">${esc(e.strength_method || "")}</span></td>
    <td>${esc(e.context_key || "")}${e.independence_group ? ` <span class="dim">[${esc(e.independence_group)}]</span>` : ""}</td>
    <td>${e.failure_class ? `<span class="pill out">${esc(e.failure_class)}</span>` : ""}</td>
    <td class="dim">${esc((e.t_valid || "").slice(0, 19))}</td>
  </tr>`);
  return `<table class="trail">
    <tr><th>kind</th><th>direction</th><th>outcome</th><th>strength</th><th>context [group]</th><th>failure class</th><th>t_valid</th></tr>
    ${rows.join("")}</table>`;
}

// ---------- trail lazy-load ----------

async function ensureTrail(card) {
  const holder = card.querySelector("[data-trail-for]");
  if (!holder || holder.dataset.loaded) return;
  holder.dataset.loaded = "1";
  holder.innerHTML = '<span class="loading">loading evidence trail&hellip;</span>';
  try {
    const type = card.dataset.trailType, id = card.dataset.trailId;
    const key = `${type}/${id}`;
    if (!state.trails[key]) state.trails[key] = await getJSON(`/api/evidence/${key}`);
    const trail = state.trails[key];
    holder.innerHTML =
      (trail.note ? `<div class="notice">${esc(trail.note)}</div>` : "") +
      trailTable(trail.evidence);
  } catch (err) {
    holder.innerHTML = `<span class="err">trail failed: ${esc(err.message)}</span>`;
  }
}

document.addEventListener("toggle", (ev) => {
  const card = ev.target;
  if (card.tagName === "DETAILS" && card.open && card.dataset.trailType) {
    ensureTrail(card);
  }
}, true);

// ---------- boot ----------

function renderAll() {
  const ov = state.overview;
  document.getElementById("viewer").textContent =
    `viewer: ${ov.viewer_id || "anonymous"} · tenant: ${short(ov.tenant_id || "")}…`;
  document.getElementById("count-episodes").textContent = `(${ov.counts.episodes})`;
  document.getElementById("count-claims").textContent = `(${ov.counts.claims})`;
  document.getElementById("count-procedures").textContent = `(${ov.counts.procedures})`;
  document.getElementById("episodes").innerHTML =
    ov.episodes.map(renderEpisode).join("") || '<span class="dim">none visible</span>';
  document.getElementById("claims").innerHTML =
    ov.claims.map(renderClaim).join("") || '<span class="dim">none visible</span>';
  document.getElementById("procedures").innerHTML =
    ov.procedures.map(renderProcedure).join("") || '<span class="dim">none visible</span>';
}

async function load() {
  document.getElementById("error").hidden = true;
  try {
    state.meta = await getJSON("/api/meta");
    const m = state.meta.posture || {};
    document.getElementById("posture").textContent =
      `read-only · oidc ${m.oidc_configured ? "on" : "off"} · private ${m.private_visibility_enabled ? "on" : "off"}`;
    state.overview = await getJSON("/api/overview");
    const notice = document.getElementById("notice");
    if (state.overview.outcome_evidence_available === false) {
      notice.textContent =
        "outcome evidence is not available on this database (pre-migration-24 instance): " +
        "capability scores read level 0 'unknown' because no recorded outcome stream exists yet";
      notice.hidden = false;
    } else {
      notice.hidden = true;
    }
    renderAll();
  } catch (err) {
    const box = document.getElementById("error");
    box.textContent = `failed to load status: ${err.message}`;
    box.hidden = false;
  }
}

document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
