# Tooling config only. This is not a packaged distribution -- the app is
# run from source via uvicorn, so there is deliberately no [project] or
# [build-system] table.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow: the pyflakes error classes and syntax errors, i.e.
# things that are wrong rather than things that are unfashionable.
#   E9   syntax / IO errors
#   F63  bad comparisons (== on types that never compare equal)
#   F7   syntax-adjacent statement misuse
#   F82  undefined names -- the one that catches a real typo'd variable
# A style pass (E, I, UP, B) is worth adding later, but it would land as
# hundreds of diffs across working code and drown the signal on the way in.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
# Adopt the scope pytest-asyncio will default to anyway; without it every
# run prints a deprecation warning that trains people to ignore output.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
