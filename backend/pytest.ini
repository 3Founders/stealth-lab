[pytest]
# The default run is the FAST suite: tests listed in tests/slow_tests.txt carry the `slow` marker (added in tests/conftest.py)
# and are skipped. Run them with   pytest -m slow     and everything with   pytest -m ""
# "Offline suite" still means: run with DATABASE_URL unset (the *_e2e.py files then skip themselves).
testpaths = tests
addopts = -m "not slow" -p no:cacheprovider
asyncio_default_fixture_loop_scope = function
markers =
    slow: takes more than a few seconds on its own (timing, subprocess, large-input or repeated-collection tests); excluded from the default run
